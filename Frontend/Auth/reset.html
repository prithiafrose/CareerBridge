<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - JobPortal</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">HireWay</a>
    <nav class="nav">
      <a href="Login.html">Login</a>
      <a href="Register.html">Register</a>
    </nav>
  </div>
</header>

<div class="auth-bg">
  <div class="login-container">
    <div class="login-form">
      <h2>Reset Password</h2>

      <form id="resetForm">
        <p>Enter your email to receive a password reset code</p>
        <p id="resetError" class="error"></p>
        <p id="resetLoading" class="loading"></p>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>

        <button type="submit">Send Reset code</button>
      </form>

      <form id="resetCodeForm" style="display: none;">
        <p>Enter the 6-digit code sent to <strong id="resetEmailLabel"></strong> and your new password</p>
        <p id="codeError" class="error"></p>
        <p id="codeLoading" class="loading"></p>

        <div class="form-group">
          <label>Reset Code</label>
          <input type="text" name="resetCode" maxlength="6" required />
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="newPassword" required />
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" name="confirmPassword" required />
        </div>

        <button type="submit">Reset Password</button>
        <button type="button" id="backToEmail" style="background: transparent; color: #667; margin-top: 10px;">Back to email</button>
      </form>

      <p>Remember your password? <a href="Login.html">Sign In</a></p>
    </div>
  </div>
</div>

<script src="reset.js" defer></script>
</body>
</html>
