<!DOCTYPE html>
<html>
<head>
  <title>Recruiter Profile</title>
  <link rel="stylesheet" href="css/recruiter.css">
</head>

<body>
  <div class="sidebar">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="4" r="2.5"/><circle cx="17" cy="14" r="3"/><circle cx="8" cy="17" r="3"/><path d="M4 21h16M4 21a9 9 0 0 1 16 0"/></svg>HireWaY</h2>
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>
    <a href="add-job.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span>Add Job</span></a>
    <a href="my-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M9 12h6"/><path d="M9 16h6"/></svg><span>My Jobs</span></a>
    <a href="applicants.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Applicants</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Profile</span></a>
    <button class="logout-btn" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Logout</span></button>
  </div>

  <div class="main">
    <div class="notif-bar">
      <div class="notification-wrapper">
        <button id="notifBtn" class="notif-btn">🔔<span id="notifCount" class="notif-count"></span></button>
        <div id="notifDropdown" class="notif-dropdown"><ul id="notifList"><li>No notifications</li></ul></div>
      </div>
    </div>

    <h1>Your Profile</h1>

    <div class="card">
       <label>Username</label>
        <input type="text" id="username" value="">

        <label>Email</label>
        <input type="email" id="email" value="">

        <label>Mobile</label>
        <input type="text" id="mobile" value="">

        <label>Current Password</label>
        <input type="password" id="currentPassword" placeholder="Leave blank if not changing">

        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Leave blank if not changing">

        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Leave blank if not changing">

        <button class="btn" type="submit">Update Profile</button>
    </div>

  </div>
  <script src="js/notifications.js"></script>
  <script src="js/recruiter.js"></script>
  <script>
    // Load user profile data
    function loadProfile() {
      fetch(API + "/auth/me", authFetchOptions())
        .then(r => {
          if (!r.ok) throw new Error('Failed to fetch profile');
          return r.json();
        })
        .then(data => {
          const user = data.user;
          document.getElementById('username').value = user.username || '';
          document.getElementById('email').value = user.email || '';
          document.getElementById('mobile').value = user.mobile || '';
        })
        .catch(err => {
          console.error('Error loading profile:', err);
        });
    }

    // Handle profile update
    document.querySelector('.btn').addEventListener('click', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const mobile = document.getElementById('mobile').value;
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validate passwords if new password is provided
      if (newPassword && newPassword !== confirmPassword) {
        alert('New password and confirm password do not match');
        return;
      }

      const updateData = { username, email, mobile };
      if (newPassword) {
        updateData.password = newPassword;
        updateData.currentPassword = currentPassword;
      }

      fetch(API + "/auth/update-profile", {
        ...authFetchOptions(),
        method: 'PUT',
        body: JSON.stringify(updateData)
      })
      .then(r => {
        if (!r.ok) throw new Error('Failed to update profile');
        return r.json();
      })
      .then(data => {
        alert('Profile updated successfully!');
        // Clear password fields
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      })
      .catch(err => {
        console.error('Error updating profile:', err);
        alert('Failed to update profile');
      });
    });

    // Load profile when page loads
    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
      loadProfile();
    });
  </script>
<script src="../chatbot/chatbot.js"></script>
</body>
</html>
