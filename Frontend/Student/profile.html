<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body><div class="navbar">
  <div class="logo">Student Panel</div>

  <div class="navbar-right">
    <div class="notification-wrapper">
      <button id="notifBtn" class="notif-btn">
        🔔
        <span id="notifCount" class="notif-count">0</span>
      </button>
      <div id="notifDropdown" class="notif-dropdown">
        <ul id="notifList">
          <li>No notifications</li>
        </ul>
      </div>
    </div>
    <button id="logout" class="logout-btn">Logout</button>
  </div>
</div>
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>
    <a href="job-list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>Jobs</span></a>
    <a href="applied-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Applied Jobs</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Profile</span></a>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <h1>My Profile</h1>

    <div class="profile-photo" style="text-align: center; margin-bottom: 20px;">
      <img id="profileImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23d9d9d9'/><circle cx='50' cy='40' r='16' fill='%23a0a0a0'/><path d='M22 82c0-16 12-24 28-24s28 8 28 24' fill='%23a0a0a0'/></svg>" alt="Profile Photo" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
      <br>
      <input type="file" id="uploadPhoto" accept="image/*" style="margin-top: 10px;">
    </div>

    <form id="profile-form" class="card">
      <h3>Personal Information</h3>
      <input type="text" id="fullNameInput" placeholder="Full Name">
      <input type="text" id="usernameInput" placeholder="Username">
      <input type="email" id="emailInput" placeholder="Email">
      <input type="text" id="mobileInput" placeholder="Phone">
      <button type="submit" class="btn">Update Profile</button>
    </form>

    <div class="card">
      <h3>Skills</h3>
      <input type="text" id="skillsInput" placeholder="Skills">
      <button class="btn" onclick="updateSkills()">Update Skills</button>
    </div>

    <form id="password-form" class="card">
      <h3>Change Password</h3>
      <input type="password" id="currentPassword" placeholder="Current Password">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
      <button type="submit" class="btn">Update Password</button>
    </form>

  </div>

  <script src="Js/notifications.js"></script>
  <script src="Js/profile.js"></script>
<script src="../chatbot/chatbot.js"></script>
</body>
</html>
