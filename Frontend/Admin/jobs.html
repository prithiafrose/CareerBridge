<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Job Listings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
  <div class="logo">Admin Panel</div>

  <div class="navbar-right">
    <div class="notification-wrapper">
      <button id="notifBtn" class="notif-btn">
        🔔
        <span id="notifCount" class="notif-count">0</span>
      </button>
      <div id="notifDropdown" class="notif-dropdown">
        <ul id="notifList">
          <li>No notifications</li>
        </ul>
      </div>
    </div>
    <button id="logout" class="logout-btn">Logout</button>
  </div>
</div>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>
    <a href="user.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Users</span></a>
    <a href="jobs.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>Job Listings</span></a>
    <a href="applications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg><span>Applications</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Profile</span></a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h1>Job Listings</h1>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Job Title</th>
            <th>Company</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobTableBody">
          <!-- Dynamic job rows will appear here -->
        </tbody>
      </table>
    </div>
  </div>







   <!-- Edit Job Modal -->
  <div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Job</h2>
      <form id="editJobForm">
        <input type="hidden" id="editJobId">
        <div class="form-group">
          <label for="editTitle">Job Title:</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-group">
          <label for="editCompany">Company:</label>
          <input type="text" id="editCompany" required>
        </div>
        <div class="form-group">
          <label for="editLocation">Location:</label>
          <input type="text" id="editLocation">
        </div>
        <div class="form-group">
          <label for="editType">Job Type:</label>
          <select id="editType">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editSalary">Salary:</label>
          <input type="text" id="editSalary">
        </div>
        <div class="form-group">
          <label for="editDescription">Description:</label>
          <textarea id="editDescription" rows="4"></textarea>
        </div>
        <div class="form-group">
          <button type="submit" class="btn">Update Job</button>
          <button type="button" class="btn" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

   <script src="../escapeHTML.js"></script>
   <script src="js/auth-helper.js"></script> 
   <script src="js/notifications.js"></script>
   <script src="js/jobs.js"></script> 
<script src="../chatbot/chatbot.js"></script>

</body>
</html>
